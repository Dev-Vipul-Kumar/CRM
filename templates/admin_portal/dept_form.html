{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'css/admin_portal.css' %}" rel="stylesheet">
</head>
<body>
<div style="min-height:100vh;background:#080b14;display:flex;align-items:flex-start;justify-content:center;padding:2.5rem 1rem;">
  <div style="width:100%;max-width:520px;">
    <a href="{% url 'accounts:admin_portal' %}" style="display:inline-flex;align-items:center;gap:.4rem;color:#6b7a99;text-decoration:none;font-size:.82rem;margin-bottom:1.25rem;transition:color .2s;" onmouseover="this.style.color='#a78bfa'" onmouseout="this.style.color='#6b7a99'">
      <i class="bi bi-arrow-left"></i> Back to Admin Portal
    </a>
    <div class="ap-card">
      <div class="ap-card-header"><span class="ap-card-title">{{ title }}</span></div>
      <div class="ap-card-body">
        <form method="POST" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label style="font-size:.82rem;font-weight:600;color:#c8ceee;display:block;margin-bottom:.35rem;">Department Name *</label>
            {{ form.name }}
            {% if form.name.errors %}<div style="color:#f87171;font-size:.75rem;margin-top:.25rem;">{{ form.name.errors.0 }}</div>{% endif %}
          </div>
          <div class="mb-4">
            <label style="font-size:.82rem;font-weight:600;color:#c8ceee;display:block;margin-bottom:.35rem;">Description</label>
            {{ form.description }}
          </div>
          <div style="display:flex;gap:.75rem;">
            <button type="submit" class="ap-btn ap-btn-primary"><i class="bi bi-check-lg"></i> Save</button>
            <a href="{% url 'accounts:admin_portal' %}" class="ap-btn ap-btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>

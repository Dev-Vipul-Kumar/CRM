{% extends "base.html" %}
{% block title %}Delete Category{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title">Delete Category</h1></div>
<div class="card" style="max-width:480px;">
  <div class="card-body p-4">
    <p>Delete category <strong>{{ cat.name }}</strong>? This cannot be undone.</p>
    <form method="POST">{% csrf_token %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'contracts:category_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
